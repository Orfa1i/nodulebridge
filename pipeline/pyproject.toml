[project]
name = "nodulebridge-pipeline"
version = "0.1.0"
description = "Offline LIDC-IDRI case preparation for NoduleBridge"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.23.5",
  "sqlalchemy==1.4.54",
  "pylidc",
  "pydicom<3",
  "SimpleITK",
  "nibabel",
  "scikit-image<0.22",
  "scipy<1.12",
  "matplotlib<3.9",
  "jsonschema",
  "reportlab",
  "requests",
  "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
