[project]
name = "nodulebridge-api"
version = "0.1.0"
description = "NoduleBridge API: extraction, rules, passport"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "babel>=2.18.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/schemas/generated"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.84.0",
    "hypothesis>=6.170.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
