[project]
name = "nodulebridge-api"
version = "0.1.0"
description = "NoduleBridge API: extraction, rules, passport"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/schemas/generated"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.84.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
